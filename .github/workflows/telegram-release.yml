name: Telegram Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to check or resend
        required: true
        type: string
      dry_run:
        description: Check bot, channel, and attachments without posting
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-release-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'wchunlin1006/LocusMimic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Install Markdown parser
        run: python -m pip install --disable-pip-version-check markdown-it-py==3.0.0
      - name: Validate and announce release
        shell: python
        run: |
          import hashlib
          import html
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from html.parser import HTMLParser
          from markdown_it import MarkdownIt

          REPOSITORY = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          CHAT_ID = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          MAX_FILE_BYTES = 49_000_000

          def request_json(url, data=None, headers=None):
              request = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f'API request rejected (HTTP {error.code}); check permissions and configuration.') from None
              except (urllib.error.URLError, TimeoutError):
                  raise RuntimeError('API request timed out or could not connect; posting status may be uncertain.') from None

          def github_release(tag):
              encoded = urllib.parse.quote(tag, safe='')
              return request_json(
                  f'https://api.github.com/repos/{REPOSITORY}/releases/tags/{encoded}',
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )

          def telegram(method, payload=None, body=None, content_type=None):
              if body is None:
                  body = json.dumps(payload or {}).encode('utf-8')
                  content_type = 'application/json'
              result = request_json(
                  f'https://api.telegram.org/bot{TOKEN}/{method}',
                  data=body,
                  headers={'Content-Type': content_type},
              )
              if not result.get('ok'):
                  raise RuntimeError('Telegram rejected the request; inspect bot and channel permissions.')
              return result['result']

          def displayed_length(markup):
              class Text(HTMLParser):
                  def __init__(self):
                      super().__init__(convert_charrefs=True)
                      self.parts = []

                  def handle_data(self, data):
                      self.parts.append(data)

              parser = Text()
              parser.feed(markup)
              return len(''.join(parser.parts).encode('utf-16-le')) // 2

          def inline_html(tokens):
              result = []
              for token in tokens or []:
                  if token.type in ('text', 'html_inline'):
                      result.append(html.escape(token.content))
                  elif token.type == 'code_inline':
                      result.append('<code>' + html.escape(token.content) + '</code>')
                  elif token.type in ('strong_open', 'strong_close', 'em_open', 'em_close'):
                      tag = 'b' if token.type.startswith('strong') else 'i'
                      result.append('</' + tag + '>' if token.nesting < 0 else '<' + tag + '>')
                  elif token.type == 'link_open':
                      result.append('<a href="' + html.escape(token.attrGet('href'), quote=True) + '">')
                  elif token.type == 'link_close':
                      result.append('</a>')
                  elif token.type in ('softbreak', 'hardbreak'):
                      result.append(' ')
                  elif token.type == 'image':
                      result.append(html.escape(token.content))
              return ''.join(result)

          def release_caption(release):
              url = release['html_url']
              if not re.fullmatch(r'https://github\.com/' + re.escape(REPOSITORY) + r'/releases/tag/[A-Za-z0-9._-]+', url):
                  raise RuntimeError('Unexpected release page URL.')
              title = html.escape(release.get('name') or release['tag_name'])
              label = 'RC 预发布' if release['prerelease'] else '正式版'
              header = f'<b>{title}</b> · {label}\n\n更新摘要\n'
              footer = f'\n\n<a href="{url}">查看完整更新日志</a>'
              sections = [{'title': '', 'items': []}]
              depth = 0
              heading = None
              for token in MarkdownIt('commonmark', {'html': False}).parse(release.get('body') or ''):
                  if token.type in ('bullet_list_open', 'ordered_list_open'):
                      depth += 1
                  elif token.type in ('bullet_list_close', 'ordered_list_close'):
                      depth -= 1
                  elif token.type == 'heading_open':
                      heading = token.tag
                  elif token.type == 'heading_close':
                      heading = None
                  elif token.type == 'inline':
                      text = inline_html(token.children)
                      if heading:
                          if heading != 'h1':
                              sections.append({'title': '<b>' + text + '</b>', 'items': []})
                      elif depth <= 1 and text.strip():
                          sections[-1]['items'].append(('• ' if depth else '') + text)

              def compose(selected, omitted=False):
                  body = []
                  for section, items in zip(sections, selected):
                      if items:
                          body.append('\n'.join(([section['title']] if section['title'] else []) + items))
                  return header + '\n\n'.join(body) + ('\n……部分条目已省略' if omitted else '') + footer

              selected = [section['items'][:] for section in sections]
              caption = compose(selected)
              if displayed_length(caption) > 1024:
                  # Keep complete entries and balance the summary across sections.
                  selected = [[] for section in sections]
                  for index in range(max((len(s['items']) for s in sections), default=0)):
                      for section_index, section in enumerate(sections):
                          if index >= len(section['items']):
                              continue
                          selected[section_index].append(section['items'][index])
                          if displayed_length(compose(selected, True)) > 1024:
                              selected[section_index].pop()
                  caption = compose(selected, True)
              if displayed_length(caption) > 1024:
                  raise RuntimeError('Release title exceeds the Telegram caption budget.')
              return caption

          def release_files(release):
              files = []
              for asset in release.get('assets', []):
                  name = asset['name']
                  if not (name.endswith(('.apk', '.sha256')) or name == 'SHA256SUMS.txt'):
                      continue
                  if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,200}', name):
                      raise RuntimeError('Unsafe release attachment filename.')
                  if not 0 < asset['size'] <= MAX_FILE_BYTES:
                      raise RuntimeError(f'Attachment {name} exceeds the Telegram upload limit or is empty.')
                  if asset.get('state') != 'uploaded':
                      return []
                  files.append(asset)
              has_apk = any(item['name'].endswith('.apk') for item in files)
              has_hash = any(item['name'].endswith('.sha256') or item['name'] == 'SHA256SUMS.txt' for item in files)
              return files if has_apk and has_hash else []

          def download(asset):
              url = asset['browser_download_url']
              if not url.startswith(f'https://github.com/{REPOSITORY}/releases/download/'):
                  raise RuntimeError('Unexpected release attachment source.')
              try:
                  with urllib.request.urlopen(url, timeout=120) as response:
                      data = response.read(MAX_FILE_BYTES + 1)
              except (urllib.error.URLError, TimeoutError):
                  raise RuntimeError('Release attachment download failed.') from None
              if len(data) != asset['size'] or len(data) > MAX_FILE_BYTES:
                  raise RuntimeError('Release attachment size mismatch.')
              return data

          def verify_checksums(files):
              expected = {}
              for name, data in files.items():
                  if name.endswith('.sha256') or name == 'SHA256SUMS.txt':
                      for line in data.decode('utf-8-sig').splitlines():
                          match = re.fullmatch(r'([0-9a-fA-F]{64})\s+\*?([^/\\]+)', line.strip())
                          if match:
                              filename = match[2]
                              digest = match[1].lower()
                              if filename in expected and expected[filename] != digest:
                                  raise RuntimeError('Conflicting release checksums.')
                              expected[filename] = digest
              for name, data in files.items():
                  if name.endswith('.apk') and expected.get(name) != hashlib.sha256(data).hexdigest():
                      raise RuntimeError(f'Attachment checksum missing or mismatched: {name}')

          def send_release(name, data, caption):
              boundary = 'LocusMimic' + uuid.uuid4().hex
              parts = []
              for key, value in [('chat_id', CHAT_ID), ('caption', caption), ('parse_mode', 'HTML')]:
                  parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="{key}"\r\n\r\n{value}\r\n'.encode())
              parts.append(f'--{boundary}\r\nContent-Disposition: form-data; name="document"; filename="{name}"\r\nContent-Type: application/vnd.android.package-archive\r\n\r\n'.encode())
              parts.extend([data, f'\r\n--{boundary}--\r\n'.encode()])
              result = telegram('sendDocument', body=b''.join(parts), content_type=f'multipart/form-data; boundary={boundary}')
              if not result.get('document') or not result.get('caption'):
                  raise RuntimeError('Unexpected sent message shape; inspect the channel before any retry.')
              print(f"Telegram document sent: message_id={result['message_id']}, caption_units={displayed_length(caption)}")

          def main():
              if not TOKEN or not CHAT_ID:
                  raise RuntimeError('Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in GitHub Actions Secrets.')
              tag = os.environ['RELEASE_TAG'].strip()
              if not re.fullmatch(r'[0-9]+-[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?', tag):
                  raise RuntimeError('Expected a versionCode-versionName release tag.')
              release = None
              for attempt in range(12):
                  release = github_release(tag)
                  if release['draft']:
                      raise RuntimeError('Draft releases must not be announced.')
                  assets = release_files(release)
                  if assets:
                      break
                  if attempt < 11:
                      time.sleep(5)
              else:
                  raise RuntimeError('Release APK and checksum assets are not ready; upload to a draft before publishing.')
              files = {asset['name']: download(asset) for asset in assets}
              verify_checksums(files)
              apks = {name: data for name, data in files.items() if name.endswith('.apk')}
              if len(apks) != 1:
                  raise RuntimeError('Expected exactly one APK per release; refusing to split the announcement.')
              caption = release_caption(release)
              bot = telegram('getMe')
              chat = telegram('getChat', {'chat_id': CHAT_ID})
              member = telegram('getChatMember', {'chat_id': CHAT_ID, 'user_id': bot['id']})
              if chat['type'] != 'channel' or member['status'] not in ('administrator', 'creator'):
                  raise RuntimeError('The destination must be a channel where the bot is an administrator.')
              if member['status'] != 'creator' and not member.get('can_post_messages'):
                  raise RuntimeError('The bot needs permission to post messages in the channel.')
              dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
              print(f'Validated {tag}, one outgoing APK, formatted release notes, checksums, bot identity, and channel permissions.')
              if dry_run:
                  print('Dry run passed. No Telegram announcement or document was sent.')
                  return
              name, data = next(iter(apks.items()))
              send_release(name, data, caption)
              print('Telegram single document message sent: APK and HTML summary with full changelog link.')

          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  message = str(error).replace(TOKEN, '[REDACTED]') if TOKEN else str(error)
                  print(f'::error::{message}')
                  raise SystemExit(1)
